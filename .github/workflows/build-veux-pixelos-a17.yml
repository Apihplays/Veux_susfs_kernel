name: Build veux (Poco/Holi SM6375) ReSukiSU+SUSFS

on:
  workflow_call:
  workflow_dispatch:

env:
  # Device env
  DEVICE_NAME : "veux"
  DEVICE_CODENAME : "veux"

  CUSTOM_CMDS : "CROSS_COMPILE=aarch64-linux-gnu- CLANG_TRIPLE=aarch64-linux-gnu-"
  EXTRA_CMDS : "LLVM=1 LLVM_IAS=1"

  KERNEL_SOURCE : "https://github.com/Apihplays/kernel_xiaomi_sm6375.git"
  KERNEL_BRANCH : "resuki" # already ReSukiSU + SusFS integrated (vdso/RIL fix included)

  # veux tree comes pre-integrated (fs/susfs.c + ReSukiSU + KSU_SUSFS config pins).
  # Let the framework clone/build/package it as-is; do NOT re-inject or clean hooks.
  CLEAN_HOOK : "false"
  KERNELSU_AUTO_GET : "false"

  CLANG_SOURCE : "https://github.com/bachnxuan/aosp_clang_mirror/releases/download/clang-r563880c-13989888/clang-r563880c.tar.gz"
  CLANG_BRANCH : ""

  GCC_GNU : false
  GCC_64_SOURCE : "https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9.git"
  GCC_64_BRANCH : "android12L-release"
  GCC_32_SOURCE : "https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/arm/arm-linux-androideabi-4.9.git"
  GCC_32_BRANCH : "android12L-release"

  DEFCONFIG_SOURCE: ""
  DEFCONFIG_NAME : "veux_defconfig"
  DEFCONFIG_ORIGIN_IMAGE: ""
  DEFCONFIG_FROM_BOOT: false

  KERNELSU_SOURCE : ""
  KERNELSU_BRANCH : ""

  KERNELSU_AUTO_FORK : "resukisu" # informational (AUTO_GET=false -> no re-injection)

  SUSFS_ENABLE : false # SusFS already integrated in the resuki tree (fs/susfs.c)
  SUSFS_FIXED : false

  # Our Anykernel3 template (boot + vendor_boot + dtbo erase, veux/peux check)
  # lives on the "ak3" branch of this repository.
  AK3_SOURCE : "https://github.com/Apihplays/Veux_susfs_kernel.git"
  AK3_BRANCH : "ak3"

  BOOT_SOURCE : ""

  NEED_DTBO : false
  NEED_SAFE_DTBO : false

  ROM_TEXT : "pixelos_a17"

  # Other env
  PYTHON_VERSION: "3" # Only 2(Ubuntu 22.04 and Ubuntu 20.04) or 3(Any OS Versions).

  PACK_METHOD: "Anykernel3" # Anykernel3 need SOURCE and BRANCH, MKBOOTIMG needn't it.
  PACK_KMODULES: "false" # if u want pack kernel modules (.ko) into Anykernel3.

  KERNELSU_METHOD: "shell" # shell, manual and only.

  PATCHES_SOURCE: "" # [your_name]/[your_patch] -> gooder123/NonGKI_Patcher
  PATCHES_BRANCH: "" # [your_branch] -> main

  SUSFS_FOLDER_FIXED: "" # Fill in your patch prefix directory here. Leave it blank if there isn't one. -> your_folder
  SUSFS_PATCH_FIXED: "" # Fill in your patches here. If there are multiple patches, please separate them with a comma. Leave it blank if there isn't one. -> patch1,patch2

  REKERNEL_ENABLE: "false" # if u need Re:Kernel.
  DROIDSPACES_ENABLE: "false" # if u need Droidspaces or LXC/Docker.
  NOMOUNT_ENABLE: "false" # if u need NoMount.
  VPNHIDE_ENABLE: "false" # if u need VPNHide.

  HOOK_METHOD: "syscall" # Manual hook method -> syscall.

  KERNEL_PATCH: "false" # If your kernel version is <= 4.9, you have the option of enabling the patch to patch the kernel_write and kernel_read functions.

  KPM_ENABLE: "false" # Anyone devices.
  KPM_INLINE: "false" # Only use it for SukiSU-Ultra.
  KPM_KPATCH_NEXT: "false" # If u want hook KPatch-Next in build step.
  KPM_PATCH_SOURCE: "https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU_patch/refs/heads/main/kpm/patch_linux" # If u want to use KPM Inline,so you need set patch exec file source -> raw.githubusercontent.com/Test/Test/patch .

  BASEBAND_GUARD_ENABLE: "false" #if u want prevent unauthorized writes to critical partitions/device nodes.
  BASEBAND_GUARD_BOOT: "false" #if u want to protect boot partition.

  GENERATE_DTB: "false" # if u kernel need DTB , but cannot auto generate it. (Only Anykernel3).
  GENERATE_CHIP: "qcom" # only supported for qcom and mediatek.
  CUSTOM_DTB: "false" # if u want use custom dtb file, and need set DTB_NAME.
  DTB_NAME: "veux" # if u want use custom dtb file, please set it

  BUILD_DEBUGGER: "false" # Output build errors (flip to false once green).
  SKIP_PATCH: "false" # Ignore errors found in Patch Debugger.

  BUILD_OTHER_CONFIG: "false" # Merge config files.
  MERGE_CONFIG_FILES: "vendor/debugfs.config"

  FREE_MORE_SPACE: "true" # if u want get more space, enabled it.

jobs:
  build-kernel:
    name: veux (PixelOS A17) ReSukiSU+SUSFS
    runs-on: ubuntu-latest # u can changed to ubuntu 22.04, and need container set ubuntu-latest
    # container: archlinux/archlinux:latest # if u need use arch linux -> archlinux/archlinux:latest or ubuntu 20.04 -> ubuntu:focal
    env:
      CCACHE_COMPILERCHECK: "%compiler% -dumpmachine; %compiler% -dumpversion"
      CCACHE_NOHASHDIR: "true"
      CCACHE_HARDLINK: "true"

    steps:
      - name: ⏰ Checkout repository
        uses: actions/checkout@v6

      - name: ⌛️ Compilation environment preparation
        uses: ./.github/workflows/build-env

      - name: ⚙️ Get neccssary tools
        uses: ./.github/workflows/build-ready

      - name: 🪝 Patch Kernel of SUSFS
        if: env.SUSFS_ENABLE == 'true' # pre-integrated on resuki -> skipped
        uses: ./.github/workflows/patch-susfs

      - name: 🔗 Patch for no-kprobe
        if: env.SUSFS_ENABLE == 'true' # pre-integrated on resuki -> skipped
        uses: ./.github/workflows/patch-no-kprobe

      - name: 🪛 Extra Kernel Options
        run: |
          # veux/peux recipe safeguards (see Obsidian vault notes 65/66):
          #   - CONFIG_MODULES=y BRICKS this QGKI fork (black screen, never boots)
          #   - ReSukiSU needs KALLSYMS_ALL / DEBUG_KERNEL
          #   - Full LTO does NOT link on AOSP clang (invalid symbol index) -> plain build
          #   - CONFIG_DEBUG_INFO=n avoids DWARF-5 / relocation-256 linker noise
          cd $GITHUB_WORKSPACE/device_kernel
          echo "# CONFIG_MODULES is not set" >> arch/arm64/configs/veux_defconfig
          echo "CONFIG_DEBUG_KERNEL=y" >> arch/arm64/configs/veux_defconfig
          echo "CONFIG_KALLSYMS=y" >> arch/arm64/configs/veux_defconfig
          echo "CONFIG_KALLSYMS_ALL=y" >> arch/arm64/configs/veux_defconfig
          echo "# CONFIG_LTO_CLANG is not set" >> arch/arm64/configs/veux_defconfig
          echo "CONFIG_DEBUG_INFO=n" >> arch/arm64/configs/veux_defconfig

      - name: 🧰 Patch Kernel of Re:Kernel
        uses: ./.github/workflows/patch-rekernel

      - name: 💿 Patch Kernel of Droidspaces
        uses: ./.github/workflows/patch-droidspaces

      - name: 🛡 Patch Kernel of VPNHide
        uses: ./.github/workflows/patch-vpnhide

      - name: 🔒 Patch Kernel of Baseband Guard
        uses: ./.github/workflows/patch-baseband-guard

      - name: 🪝 Patch Kernel of NoMount
        uses: ./.github/workflows/patch-nomount

      - name: 🚀 Build Process
        uses: ./.github/workflows/build-process

      - name: 🧊 Copy built veux.dtb into pack dir
        run: |
          # package_veux.sh pairs the built Image with the BUILT per-device dtb
          # (dts/vendor/xiaomi/veux.dtb), not a stock one.
          cd $GITHUB_WORKSPACE/device_kernel
          if [ ! -f out/arch/arm64/boot/dts/vendor/xiaomi/veux.dtb ]; then
            echo "[+] dtbs not built by default target, building them..."
            make -j$(nproc --all) CC="ccache clang" ${{ env.CUSTOM_CMDS }} ${{ env.EXTRA_CMDS }} O=out ARCH=${{ env.KERNEL_ARCH }} dtbs
          fi
          cp -f out/arch/arm64/boot/dts/vendor/xiaomi/veux.dtb out/arch/arm64/boot/dtb
          ls -l out/arch/arm64/boot/dtb

      - name: 🔩 Pack Process
        uses: ./.github/workflows/pack-process

      - name: ✏️ Upload Artifacts
        uses: ./.github/workflows/upload-files